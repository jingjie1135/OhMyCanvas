# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Infinite Canvas
spec:
  description: AI creative canvas with ComfyUI, OpenAI-compatible APIs, APIMart, Volcengine, ModelScope, and local asset workflows.
  icon: https://raw.githubusercontent.com/hero8152/Infinite-Canvas/main/%E8%B5%9E%E8%B5%8F.png
  tags:
    - AI
    - Tool
    - Website
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Public Domain
      description: The public domain Zeabur binds to Infinite Canvas.
  readme: |-
    # Infinite Canvas on Zeabur

    Infinite Canvas is a FastAPI-based creative canvas for ComfyUI, OpenAI-compatible image/video APIs, APIMart, Volcengine, ModelScope, and local media workflows.

    ## What this template deploys

    - One Git service from `hero8152/Infinite-Canvas`.
    - HTTP port `3000` bound to the domain selected during deployment.
    - Persistent volumes for runtime configuration, generated media, uploaded assets, conversations, canvases, and custom workflows.

    ## Important environment behavior

    This template sets both:

    - `PUBLIC_BASE_URL=https://${PUBLIC_DOMAIN}`
    - `PUBLIC_MEDIA_BASE_URL=https://${PUBLIC_DOMAIN}`

    These let external generation providers fetch local `/assets/...` and `/output/...` media through the Zeabur public domain.

    ## After deploy

    1. Open the bound Zeabur domain.
    2. Go to API settings in the web UI.
    3. Add your API provider keys and model endpoints.
    4. If you use a separate ComfyUI service, update `COMFYUI_INSTANCES` to the reachable host:port.

    Secrets saved from the UI are written under `/app/API/.env`, which is persisted by this template.
  resourceRequirement:
    minConfig:
      cpu: 1
      ram: 1
    recommendedConfig:
      cpu: 2
      ram: 4
  services:
    - name: infinite-canvas
      icon: https://raw.githubusercontent.com/hero8152/Infinite-Canvas/main/%E8%B5%9E%E8%B5%8F.png
      template: GIT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1235082631
          branch: main
        ports:
          - id: web
            port: 3000
            type: HTTP
        volumes:
          - id: api-config
            dir: /app/API
          - id: app-data
            dir: /app/data
          - id: generated-output
            dir: /app/output
          - id: asset-input
            dir: /app/assets/input
          - id: asset-output
            dir: /app/assets/output
          - id: asset-library
            dir: /app/assets/library
          - id: custom-workflows
            dir: /app/workflows/custom
        env:
          PORT:
            default: "3000"
          PUBLIC_BASE_URL:
            default: https://${PUBLIC_DOMAIN}
          PUBLIC_MEDIA_BASE_URL:
            default: https://${PUBLIC_DOMAIN}
          PUBLIC_MEDIA_TOKEN:
            default: ""
          COMFYUI_INSTANCES:
            default: 127.0.0.1:8188
          MODELSCOPE_API_KEY:
            default: ""

localization:
  zh-CN:
    description: 支持 ComfyUI、OpenAI 兼容 API、APIMart、火山引擎、ModelScope 和本地素材工作流的 AI 创作画布。
    readme: |-
      # Zeabur 部署 Infinite Canvas

      这个模板会从 `hero8152/Infinite-Canvas` 部署一个 FastAPI 服务，并把 HTTP 端口 `3000` 绑定到你选择的 Zeabur 域名。

      ## 模板包含

      - 一个 Git 服务：`infinite-canvas`
      - 持久化 `/app/API`、`/app/data`、`/app/output`、`/app/assets/*`、`/app/workflows/custom`
      - 自动设置 `PUBLIC_BASE_URL` 和 `PUBLIC_MEDIA_BASE_URL`

      ## 为什么要设置 PUBLIC_MEDIA_BASE_URL

      外部生图/生视频服务无法访问容器内的本地路径。模板会把它设置为：

      - `PUBLIC_BASE_URL=https://${PUBLIC_DOMAIN}`
      - `PUBLIC_MEDIA_BASE_URL=https://${PUBLIC_DOMAIN}`

      这样 APIMart、火山等外部服务可以通过 Zeabur 公网域名读取 `/assets/...` 和 `/output/...` 文件。

      ## 部署后

      1. 打开 Zeabur 绑定的域名。
      2. 进入网页里的 API 设置。
      3. 添加你的 API Key、模型和接口地址。
      4. 如果你有单独的 ComfyUI 服务，把 `COMFYUI_INSTANCES` 改成可访问的 `host:port`。

      网页里保存的密钥会写入 `/app/API/.env`，这个目录已挂载为 Zeabur 持久卷。
